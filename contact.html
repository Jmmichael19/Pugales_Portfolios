<!DOCTYPE html>
<html lang="en">
  <head>
    <title>My Portfolio</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script
      type="text/javascript"
      src="https://cdn.emailjs.com/sdk/2.3.2/email.min.js"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="icon" type="image" href="icon.png" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>
  <style>
    .nav-item {
      padding-left: 120%;
      justify-content: space-between;
    }  
    .nav-item :hover{
      color:white;
    }      
      body {
            background-image: url(https://images.freeimages.com/images/large-previews/01a/technology-background-1632715.jpg);
            background-size: cover;
      }
  </style>
  <body>
    <nav class="navbar navbar-expand-sm" style="background-color: #7091F5">
      <div class="container-fluid">
        <img src="logo.png" alt="logo" style="padding-left: 6%;"/>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#collapsibleNavbar"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="collapsibleNavbar">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" href="home.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="aboutme.html" style="border-radius: 12px"><h6>About</h6></a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <div class="row"></div>

      <div class="col p-6 d-flex justify-content-center align-items-center flex-column" style="background-image:url(https://images.freeimages.com/images/large-previews/01a/technology-background-1632715.jpg)">
        <h1 style="color:white">Contact Us</h1>
        <form id="contact-form" class="form-group">
          <label for="name" style="color:white">Name:</label>
          <input type="text" class="form-control" id="name" name="name" required /><br /><br />
          <label for="email" style="color:white">Email:</label>
          <input type="email" class="form-control" id="email" name="email" required /><br /><br />
          <label for="subject" style="color:white">Subject</label>
          <input type="text" class="form-control" id="subject" name="subject" required /><br /><br />
          <label for="message" style="color:white">Message:</label><br />
          <textarea id="message"  class="form-control" name="message" required></textarea><br /><br />
          <button type="submit" class="btn btn-success"style="background-color: #7091F5;">Send Message</button>
        </form>
        <script src="app.js"></script></div>
      <div class="col p-3"></div>
    </div>

    <footer style="text-align: center; padding: 20px; color:white">All rights reserves, © John Michael N. Pugales</footer>
    
  </body>
